name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (format, validate, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # Validation and the tests run inside Claude Code's own plugin tooling,
      # so the CLI is installed here. Neither command calls a model. Whether
      # they run without a signed-in account on a hosted runner is not yet
      # verified: see CONTRIBUTING.md, "What CI verifies".
      - run: npm install --global @anthropic-ai/claude-code
      - run: npm run validate
      - run: npm run test
